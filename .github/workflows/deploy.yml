name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
  # Also run by the Early Bloom Play check after it flips
  # early-bloom-status.json (a push made by a workflow doesn't start
  # another workflow, but asking for a run does).
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HALLOWED_GAINS_WEBSITE }}
          channelId: live
          projectId: hallowed-gains-website
