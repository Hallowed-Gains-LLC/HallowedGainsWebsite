name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
  # Run by hand from the Actions tab to redeploy without a change.
  workflow_dispatch:
  # The games under /games live in other repos (see games/sources.json).
  # Every 30 minutes, redeploy if any of them has new commits, so pushing a
  # game goes live here without touching this repo.
  schedule:
    - cron: "*/30 * * * *"

# Never run two deploys at once; a queued one waits for the current one.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # Scheduled runs only: compare each source repo's latest commit with the
  # commits recorded in the live site's /games/versions.json.
  check-games:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - id: compare
        run: |
          scripts/fetch-games.sh --versions > latest.json
          # If the live file can't be read (first deploy, outage), deploy anyway.
          curl -fsS https://hallowedgains.com/games/versions.json > live.json || echo '{}' > live.json
          if [ "$(jq -S . latest.json)" = "$(jq -S . live.json)" ]; then
            echo "Games are up to date."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Games changed:"; diff <(jq -S . live.json) <(jq -S . latest.json) || true
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: check-games
    # always() keeps this job from being skipped on push/manual runs, where
    # check-games itself is skipped; scheduled runs deploy only on a change.
    if: >-
      always() &&
      (github.event_name != 'schedule' || needs.check-games.outputs.changed == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pull in the games
        run: scripts/fetch-games.sh
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HALLOWED_GAINS_WEBSITE }}
          channelId: live
          projectId: hallowed-gains-website
