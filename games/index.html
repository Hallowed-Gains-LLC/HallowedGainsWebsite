<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Unlisted page: nothing links here, and search engines are told to
         stay out (also sent as an X-Robots-Tag header in firebase.json). -->
    <meta name="robots" content="noindex, nofollow">
    <title>Games · Hallowed Gains</title>
    <link rel="icon" type="image/png" href="/HallowedGains_Logo_Lettermark_Gold.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
    <style>
        /* Colors match the main site's Tailwind palette (index.html). */
        :root {
            --ivory: #F7F3E3;
            --ivory-border: #EDE4CC;
            --muted: #8A7866;
            --dark: #322E2C;
            --gold: #AF9164;
            --gold-soft: #EFE3CB;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--dark);
            color: var(--ivory);
            font-family: Inter, system-ui, sans-serif;
            line-height: 1.5;
        }

        main {
            max-width: 40rem;
            margin: 0 auto;
            padding: 3.5rem 1rem 4rem;
        }

        header { text-align: center; margin-bottom: 2.5rem; }
        header img { width: 2.25rem; height: auto; }
        h1 {
            font-family: "Playfair Display", Georgia, serif;
            font-size: 2.25rem;
            margin: 0.75rem 0 0.25rem;
        }
        header p { margin: 0; color: rgb(247 243 227 / 0.65); }

        #games { display: grid; gap: 1rem; padding: 0; margin: 0; list-style: none; }

        .game {
            display: flex;
            align-items: center;
            gap: 1.25rem;
            padding: 1.25rem;
            border-radius: 1rem;
            background: var(--ivory);
            border: 1px solid var(--ivory-border);
            color: var(--dark);
            text-decoration: none;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .game:hover, .game:focus-visible {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgb(0 0 0 / 0.25);
        }
        .game:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

        .game-art {
            flex-shrink: 0;
            display: grid;
            place-items: center;
            width: 4rem;
            height: 4rem;
            border-radius: 0.75rem;
            background: var(--gold-soft);
            font-size: 2rem;
            overflow: hidden;
        }
        .game-art img { width: 100%; height: 100%; object-fit: cover; }

        .game h2 { margin: 0; font-size: 1.125rem; font-weight: 600; }
        .game p { margin: 0.125rem 0 0; color: var(--muted); font-size: 0.95rem; }

        #status { text-align: center; color: rgb(247 243 227 / 0.65); }
    </style>
</head>
<body>
    <main>
        <header>
            <a href="/"><img src="/HallowedGains_Logo_Lettermark_Gold.png" alt="Hallowed Gains home"></a>
            <h1>Games</h1>
            <p>A few little things we made for fun.</p>
        </header>

        <ul id="games"></ul>
        <p id="status">Loading&hellip;</p>
    </main>

    <!-- One card per game. scripts/fetch-games.sh writes games.json at deploy
         time from each game folder's game.json, so this page never needs
         editing when a game is added. -->
    <template id="game-card">
        <li>
            <a class="game">
                <span class="game-art"></span>
                <span>
                    <h2></h2>
                    <p></p>
                </span>
            </a>
        </li>
    </template>

    <script>
        'use strict';

        /** Build one menu card. Uses textContent throughout, never innerHTML. */
        function renderCard(game) {
            const card = document.getElementById('game-card').content.cloneNode(true);
            const link = card.querySelector('a');
            const art = card.querySelector('.game-art');

            // Absolute paths, so links work whether this page was opened as
            // /games or /games/.
            const base = '/games/' + game.slug + '/';
            link.href = base;
            card.querySelector('h2').textContent = game.title;
            card.querySelector('p').textContent = game.description;

            // Prefer the game's own icon (a path inside its folder), else an emoji.
            if (game.icon) {
                const img = document.createElement('img');
                img.src = base + game.icon;
                img.alt = '';
                art.appendChild(img);
            } else {
                art.textContent = game.emoji || '🎮';
            }
            return card;
        }

        (async function () {
            const status = document.getElementById('status');
            try {
                const res = await fetch('/games/games.json', { cache: 'no-cache' });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const { games } = await res.json();
                const list = document.getElementById('games');
                games.forEach(game => list.appendChild(renderCard(game)));
                status.remove();
            } catch (err) {
                status.textContent = 'Could not load the games. Check your connection and refresh.';
            }
        })();
    </script>
</body>
</html>
